name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,game]"
      - name: Leak guard
        # Competition IDs must never appear in the repo or the web export (SPEC C5)
        run: python scripts/leak_scan.py
      - name: Lint
        run: ruff check .
      - name: Test
        # Tests that need the competition data are skipped automatically (data is not in the repo).
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        # `npm run build` = tsc --noEmit (strict, includes the frozen JSON types) + vite build
        run: npm run build
