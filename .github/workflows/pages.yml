name: Pages

# Builds the static site (web/) and deploys it to GitHub Pages: https://coder-r2.github.io/SussyPoker/
# Needs Pages enabled once (Settings -> Pages -> Source: GitHub Actions). The game server URL comes from the
# repository variable API_BASE (Settings -> Secrets and variables -> Actions -> Variables), defaulting to the
# Render service in render.yaml.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.API_BASE || 'https://suspoker-api.onrender.com' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
